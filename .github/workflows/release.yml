name: release

# Builds the real binary (real azalea, every real_*.rs, bindings generated by build.rs) for every target below and attaches one zip per target to a
# GitHub release. Each zip is named after the Rust target triple, <architecture>-<vendor>-<os>-<abi>.zip (a field the triple has none of is left out,
# e.g. aarch64-apple-darwin, aarch64-linux-android), and holds `luaxite` at its root.
#
#   (no 32-bit targets: azalea depends on simdnbt, which only supports 64-bit platforms)
#   Linux (universal)  static musl, runs on any distro, built with cargo-zigbuild
#   Termux (Bionic)    the Android targets, built with cargo-ndk at API 24 (Android 7, Termux's minimum)
#   macOS              built natively on an Apple-silicon runner (the x86_64 one is cross-compiled)
#   Windows            MSVC, built on a Windows runner (the aarch64 one is cross-compiled); the zip holds luaxite.exe, install.ps1 downloads it
#
# Trigger: push a tag (`git tag v0.1.0 && git push origin v0.1.0`), or run it by hand: with a `tag` it publishes that release, without one it only
# builds and keeps the zips as workflow artifacts.

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to publish (created at this commit when it does not exist yet). Empty = build only, no release."
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

env:
    BIN: luaxite
    # a nightly's rustdoc JSON format_version is newer than the 57 of stable (same setting as rust.yml `real`)
    AZL_RDJ_FORMAT_RANGE: "57-99"
    CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
    build:
        name: ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 120
        strategy:
            fail-fast: false    # one target failing must not stop the others from building (one run lists every broken target); nothing is released unless all succeed
            matrix:
                include:
                    # Linux (universal): static musl
                    - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, method: zigbuild, smoke: true }
                    - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04, method: zigbuild }
                    # Termux (Bionic libc)
                    - { target: aarch64-linux-android, runner: ubuntu-24.04, method: ndk, abi: arm64-v8a }
                    - { target: x86_64-linux-android, runner: ubuntu-24.04, method: ndk, abi: x86_64 }
                    # macOS
                    - { target: aarch64-apple-darwin, runner: macos-latest, method: native, smoke: true }
                    - { target: x86_64-apple-darwin, runner: macos-latest, method: native }
                    # Windows (MSVC); `exe` is the binary's file suffix
                    - { target: x86_64-pc-windows-msvc, runner: windows-latest, method: native, smoke: true, exe: .exe }
                    - { target: aarch64-pc-windows-msvc, runner: windows-latest, method: native, exe: .exe }
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/azalea
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"    # build.rs runs tools/bindgen.py (3.11+ for tomllib)
            - name: python3 alias (only if setup-python did not already provide python3; build.rs and the steps below call python3)
              if: runner.os == 'Windows'
              run: command -v python3 >/dev/null 2>&1 || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
            - name: azalea toolchain and target
              run: |
                  # azalea uses nightly-only features: document and build with the nightly its rust-toolchain.toml names
                  ch=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["toolchain"]["channel"])' bind/azalea-src/rust-toolchain.toml 2>/dev/null || true)
                  ch=${ch:-nightly}
                  echo "azalea toolchain: $ch"
                  rustup toolchain install "$ch" --profile minimal --no-self-update
                  rustup target add --toolchain "$ch" "${{ matrix.target }}"
                  echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}-${{ hashFiles('bind/azalea-src/Cargo.lock') }}
                  cache-on-failure: true

            - name: install cargo-zigbuild (zig is the C/C++ cross compiler for musl)
              if: matrix.method == 'zigbuild'
              run: python3 -m pip install cargo-zigbuild ziglang
            - name: install cargo-ndk (the runner's Android NDK is the cross compiler)
              if: matrix.method == 'ndk'
              run: |
                  cargo +stable install cargo-ndk --locked
                  echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

            - name: build
              run: |
                  case "${{ matrix.method }}" in
                      zigbuild) cargo zigbuild --release --target "${{ matrix.target }}" ;;
                      ndk)      cargo ndk --target "${{ matrix.abi }}" --platform 24 build --release ;;
                      native)   cargo build --release --target "${{ matrix.target }}" ;;
                  esac
                  ls -l "target/${{ matrix.target }}/release/$BIN${{ matrix.exe }}"
            - name: smoke test (only where the runner can execute the binary)
              if: matrix.smoke
              run: target/${{ matrix.target }}/release/$BIN${{ matrix.exe }} --help > /dev/null
            - name: package
              run: |
                  mkdir -p dist
                  if [ "$RUNNER_OS" = Windows ]; then
                      # no `zip` on the Windows runner: python (relative paths, so no MSYS/Windows path mix-up)
                      python3 -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], 'w', zipfile.ZIP_DEFLATED, compresslevel=9); z.write(sys.argv[2], sys.argv[3]); z.close()" \
                          "dist/${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/$BIN.exe" "$BIN.exe"
                  else
                      stage=$(mktemp -d)
                      cp "target/${{ matrix.target }}/release/$BIN" "$stage/"
                      (cd "$stage" && zip -9 -X "$GITHUB_WORKSPACE/dist/${{ matrix.target }}.zip" "$BIN")
                  fi
                  ls -l dist
            - uses: actions/upload-artifact@v4
              with:
                  name: zip-${{ matrix.target }}
                  path: dist/${{ matrix.target }}.zip
                  if-no-files-found: error
                  compression-level: 0    # already zipped

    release:
        needs: build
        # a pushed tag, or a manual run that names one. No `!cancelled()` / `always()`: the implicit success() means the release is only published when
        # EVERY target built, because install.sh / install.ps1 download from releases/latest and users on a missing target would get a 404
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: zip-*
                  merge-multiple: true
                  path: dist
            - name: publish
              run: |
                  ls -l dist
                  [ -n "$(ls dist/*.zip 2>/dev/null)" ] || { echo "no zip was built"; exit 1; }
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
                  else
                      gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
                  fi
